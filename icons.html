    <!-- load prism -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/prism.min.js" defer></script>


    <link rel="stylesheet" href="dist/enhanceInputs.min.css">
    <script src="dist/enhanceInputs.js" defer></script>


    <script src="demo/icons.js" defer></script>


    <template data-csp-style>
    </template>



    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--color-background);
        }
    </style>


</head>

<!-- auto init by class name enhanceInputsInit -->

<body class=" --scrollbar scroll-content --scroll-track" data-enhance-inputs='{"storageName":"iconsSettings","parent":"body","selector":"input, select, textarea","cacheToUrl":false, "getQuery":true, "cacheToStorage":true,"icons":""}'>


        <div class="styles pst-sticky bg z-ind-100 pdd-1em fnt-siz-0-75">
            <h3>Icon styles</h3>
            <p>
                <label><input type="radio" name="iconStyle" value="" checked>normal</label>
                <label><input type="radio" name="iconStyle" value="circle">circle</label>
                <label><input type="radio" name="iconStyle" value="square">square</label>
                <label><input type="radio" name="iconStyle" value="square-rounded">square rounded</label>
            </p>

            <h3>Icon color</h3>
            <p>
                <label><input type="radio" name="iconColor" value="" checked>normal</label>
                <label><input type="radio" name="iconColor" value="negative">negative</label>
            </p>

            <h3>Icon weights</h3>
            <p>
                <label><input type="radio" name="iconWeight" value="thin">thin</label>
                <label><input type="radio" name="iconWeight" value="light">light</label>
                <label><input type="radio" name="iconWeight" value="normal" checked>normal</label>
                <label><input type="radio" name="iconWeight" value="medium">medium</label>
                <label><input type="radio" name="iconWeight" value="bold">bold</label>
                <!-- 
                    <label><input type="radio" name="iconWeight" value="black">black</label>
                -->
            </p>

            <h3>Icon corner rounding</h3>
            <p>
                <label><input type="radio" name="iconCorner" value="normal" checked>normal</label>
                <label><input type="radio" name="iconCorner" value="round">round</label>
                <label><input type="radio" name="iconCorner" value="sharp">sharp</label>
            </p>
        </div>


    <main class="pdd-1em --enhance-inputs-init --details-enhanced"
        >





        <h3>Spritemap</h3>
        <div id="spriteMap" class="fnt-siz-2em"></div>




    </main>





</body>

</html>
